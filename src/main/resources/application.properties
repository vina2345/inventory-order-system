spring.application.name=inventory-order-system
server.port=8080

# ---- Default: in-memory H2 (runs with zero setup) ----
spring.datasource.url=jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- To use MySQL instead, comment the H2 block above and uncomment: ----
# spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=your_password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# CORS: comma-separated allowed frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
